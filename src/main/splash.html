<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Steez</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #141414; overflow: hidden; -webkit-user-select: none; user-select: none; cursor: default; }
    body { font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; color: #e8e8e8; border: 1px solid #2a2a2a; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity .28s ease; -webkit-app-region: drag; }
    body.out { opacity: 0; }
    .mark { display: flex; gap: 2px; font-size: 46px; font-weight: 800; letter-spacing: .14em; line-height: 1; overflow: hidden; padding-left: .14em; }
    .mark span { display: inline-block; transform: translateY(110%); animation: rise .55s cubic-bezier(.2,.8,.2,1) forwards; }
    .mark span:nth-child(1) { animation-delay: .05s; }
    .mark span:nth-child(2) { animation-delay: .11s; }
    .mark span:nth-child(3) { animation-delay: .17s; }
    .mark span:nth-child(4) { animation-delay: .23s; }
    .mark span:nth-child(5) { animation-delay: .29s; }
    @keyframes rise { to { transform: translateY(0); } }
    .rule { width: 0; height: 1px; background: #8a8a8a; margin-top: 16px; animation: draw .5s .55s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { width: 196px; } }
    .status { margin-top: 26px; font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: #8c8c8c; opacity: 0; animation: fade .4s .85s forwards; height: 14px; }
    @keyframes fade { to { opacity: 1; } }
    .bar { width: 196px; height: 2px; background: #262626; margin-top: 10px; position: relative; overflow: hidden; opacity: 0; animation: fade .4s .9s forwards; }
    .bar i { position: absolute; top: 0; left: 0; height: 100%; width: 0; background: #d6d6d6; transition: width .2s linear; }
    .bar.indeterminate i { width: 34%; animation: slide 1.1s cubic-bezier(.6,0,.4,1) infinite; }
    @keyframes slide { from { left: -34%; } to { left: 100%; } }
    .ver { position: absolute; bottom: 10px; right: 12px; font-size: 10px; color: #555; letter-spacing: .08em; }
    .corner { position: absolute; width: 10px; height: 10px; border-color: #3a3a3a; border-style: solid; opacity: 0; animation: fade .3s .6s forwards; }
    .tl { top: 10px; left: 10px; border-width: 1px 0 0 1px; }
    .br { bottom: 10px; left: 10px; border-width: 0 0 1px 1px; }
  </style>
</head>
<body>
  <i class="corner tl"></i><i class="corner br"></i>
  <div class="mark"><span>S</span><span>T</span><span>E</span><span>E</span><span>Z</span></div>
  <div class="rule"></div>
  <div class="status" id="status">Starting</div>
  <div class="bar indeterminate" id="bar"><i id="fill"></i></div>
  <div class="ver" id="ver"></div>
  <script>
    const $ = (id) => document.getElementById(id);
    window.splash = {
      set(text, pct) {
        $('status').textContent = text;
        const bar = $('bar');
        if (pct == null) bar.classList.add('indeterminate');
        else {
          bar.classList.remove('indeterminate');
          $('fill').style.width = Math.max(0, Math.min(100, pct)) + '%';
        }
      },
      version(v) { $('ver').textContent = v; },
      out() { document.body.classList.add('out'); },
    };
  </script>
</body>
</html>
