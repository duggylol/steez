<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Steez</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #0b0c12; overflow: hidden; -webkit-user-select: none; user-select: none; cursor: default; }
    body { font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; color: #ecedf4; border: 1px solid #20212d; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity .28s ease; -webkit-app-region: drag; }
    body.out { opacity: 0; }
    .mark { display: flex; font-size: 52px; font-weight: 800; letter-spacing: -.03em; line-height: 1; overflow: hidden; padding: 0 4px 4px; }
    .mark span { display: inline-block; transform: translateY(110%); animation: rise .55s cubic-bezier(.2,.8,.2,1) forwards; }
    .mark span:nth-child(1) { animation-delay: .05s; }
    .mark span:nth-child(2) { animation-delay: .11s; }
    .mark span:nth-child(3) { animation-delay: .17s; }
    .mark span:nth-child(4) { animation-delay: .23s; }
    .mark span:nth-child(5) { animation-delay: .29s; }
    .mark span:nth-child(6) { animation-delay: .35s; }
    .mark .dot { color: #8f7cff; }
    @keyframes rise { to { transform: translateY(0); } }
    .status { margin-top: 26px; font-size: 12.5px; color: #a4a6b8; opacity: 0; animation: fade .4s .7s forwards; height: 16px; }
    @keyframes fade { to { opacity: 1; } }
    .bar { width: 200px; height: 4px; border-radius: 99px; background: #1a1b26; margin-top: 12px; position: relative; overflow: hidden; opacity: 0; animation: fade .4s .75s forwards; }
    .bar i { position: absolute; top: 0; left: 0; height: 100%; width: 0; border-radius: 99px; background: #8f7cff; transition: width .2s linear; }
    .bar.indeterminate i { width: 34%; animation: slide 1.1s cubic-bezier(.6,0,.4,1) infinite; }
    @keyframes slide { from { left: -34%; } to { left: 100%; } }
    .ver { position: absolute; bottom: 12px; right: 14px; font-size: 11px; color: #6b6d80; }
    @media (prefers-reduced-motion: reduce) { .mark span { transform: none; animation: none; } .status, .bar { opacity: 1; animation: none; } }
  </style>
</head>
<body>
  <div class="mark"><span>S</span><span>t</span><span>e</span><span>e</span><span>z</span><span class="dot">.</span></div>
  <div class="status" id="status">Starting</div>
  <div class="bar indeterminate" id="bar"><i id="fill"></i></div>
  <div class="ver" id="ver"></div>
  <script>
    const $ = (id) => document.getElementById(id);
    window.splash = {
      set(text, pct) {
        $('status').textContent = text;
        const bar = $('bar');
        if (pct == null) bar.classList.add('indeterminate');
        else {
          bar.classList.remove('indeterminate');
          $('fill').style.width = Math.max(0, Math.min(100, pct)) + '%';
        }
      },
      version(v) { $('ver').textContent = v; },
      out() { document.body.classList.add('out'); },
    };
  </script>
</body>
</html>
