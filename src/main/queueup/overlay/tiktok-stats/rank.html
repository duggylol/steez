<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Steez TikTok Gaming Rank</title>
<link rel="stylesheet" href="/overlay/kit/kit.css" />
<link rel="stylesheet" href="/overlay/tiktok-stats/stats.css" />
<link rel="stylesheet" href="/overlay/kit/themes.css" />
</head>
<body data-kind="rank" class="k-badge empty" data-theme="steez" data-entrance="rise" data-change="bump" data-idle="none">
  <div class="stage" id="stage">
    <div class="w-motion">
      <div class="w badge" id="badge">
        <div class="w-glow" aria-hidden="true"></div>
        <div class="w-fx" aria-hidden="true"><div class="sparkles" id="sparkles"></div><i class="w-sweep"></i><i class="w-stripes"></i></div>
        <div class="w-icon" aria-hidden="true">
          <i class="w-ring"><b></b><b></b></i>
          <svg viewBox="0 0 24 24"><path d="M7 3.5h10V8a5 5 0 0 1-10 0z"/><path d="M7 5.5H3.8v1.2A3.3 3.3 0 0 0 7 10M17 5.5h3.2v1.2A3.3 3.3 0 0 1 17 10"/><path d="M12 13v3.2M8.2 20.5h7.6l-.7-4.3H8.9z"/></svg>
        </div>
        <div class="w-body">
          <div class="w-label" id="label"><span class="w-label-text" id="labelText">GAMING · DAILY</span></div>
          <div class="w-value" id="value"><span class="num" id="num">—</span><span class="of" id="of"></span></div>
          <div class="w-sub" id="sub"></div>
          <div class="w-bar" id="bar"><i id="fill"></i></div>
        </div>
        <div class="w-flash" aria-hidden="true"></div>
        <i class="w-pop" id="pop" aria-hidden="true"></i>
      </div>
    </div>
  </div>
  <script src="/overlay/kit/kit.js"></script>
  <script src="/overlay/tiktok-stats/stats.js"></script>
</body>
</html>
