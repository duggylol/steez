<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Steez TikTok Gifts</title>
<link rel="stylesheet" href="/overlay/gifts/gifts.css" />
</head>
<body class="ring particles glow">
  <div class="stage" id="stage">
    <div class="card" id="card">
      <div class="sparkles" id="sparkles" aria-hidden="true"></div>

      <div class="panel" id="panel">
        <div class="title" id="title">
          <span class="star">✦</span><span class="title-text" id="titleText">TOP STREAK</span><span class="star">✦</span>
        </div>

        <div class="medallion" id="medallion">
          <div class="orbit"><i></i><i></i><i></i><i></i></div>
          <div class="coin" id="coin">
            <div class="coin-face" id="coinFace"></div>
            <div class="coin-badge" id="coinBadge">★</div>
          </div>
        </div>

        <div class="name" id="name">—</div>
        <div class="stat" id="stat"><span class="stat-dot"></span><span class="stat-value" id="statValue">x0</span><span class="stat-label" id="statLabel">Streak</span></div>
        <div class="sub" id="sub"></div>
      </div>

      <div class="empty" id="empty"><span class="pulse"></span><span id="emptyText">No gifts yet</span></div>
    </div>
  </div>
  <script src="/overlay/gifts/gifts.js"></script>
</body>
</html>
